# Pixa CI — runs on every push and pull request.
#
# What runs here (all free, no GPU, no billing):
# - typecheck: tsc across all workspaces
# - worker-smoke: python compile + imports + CLI parse of the reconstruction worker
# - notify-unit: offline notify.py tests (stamp-before-send, fail-closed, skips)
# - worker-perf: generation regressions (tiers, adaptive fps, portrait bounds,
#   train-slot lock, SPZ finalize) + admission-control units
# - notifications: offline unit tests against an isolated STORAGE_DIR
# - auth: HTTP auth matrix + identity regression (stable numeric accepted,
#   poisoned uuid rejected) against a throwaway prod server with dummy creds
#   (self-seeding fixtures; never touches real data; 401s fire before AI work)
# - scenes: CRUD, rename, multi-pass join, delete, ensureUser row — same throwaway
# - longvideo: chunked uploads, analysis, split/merge, dispatch+cancel, recover
#   (spawns only a 100-iteration probe; spirula binary absent on Linux so the
#   backend fails fast and cancel is exercised — full trains stay manual)
#
# What does NOT run here (needs this Mac's GPU, real footage, or billed APIs):
# - scripts/index-scene.mts / track-scene.mts / register-entities.mts (Meta API spend)
# - browser-verified visual checks (screenshots are taken locally pre-commit)
# Run those manually before release; see docs/long-video-report.md.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspaces --if-present

  worker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile + import worker
        run: |
          cd services/reconstruction
          python3 -m py_compile worker/__main__.py worker/media.py worker/store.py worker/analysis.py worker/backends/spirula.py worker/backends/kiri.py worker/backends/runpod.py worker/backends/local.py
          python3 -m worker --help > /dev/null
          echo "worker smoke OK"

  notifications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: STORAGE_DIR=/tmp/wl-ntest npx tsx scripts/test-notifications.mts

  notify-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: STORAGE_DIR=/tmp/wl-ntest python3 scripts/test-notify.py

  worker-perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci
      - name: Worker generation/perf regressions
        run: python3 scripts/test-worker-perf.py
      - name: Admission control units
        run: STORAGE_DIR=/tmp/wl-admtest npx tsx --conditions react-server scripts/test-admission.mts

  auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace apps/web
      - name: Start throwaway server with dummy creds
        env:
          AUTH_URL: http://localhost:3000
        run: |
          STORAGE_DIR=/tmp/wl-authtest \
          AUTH_SECRET=dummy-secret-for-ci-only \
          GOOGLE_CLIENT_ID=dummy-ci-id \
          GOOGLE_CLIENT_SECRET=dummy-ci-secret \
          AUTH_URL=http://localhost:3000 \
          nohup npx next start --port 3000 > /tmp/pixa-ci.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/me > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:3000/api/me
        working-directory: apps/web
      - name: Run auth matrix
        env:
          AUTH_SECRET: dummy-secret-for-ci-only
          AUTH_URL: http://localhost:3000
        run: STORE=/tmp/wl-authtest BASE=http://localhost:3000 bash scripts/test-auth.sh

  scenes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci
      - run: npm run build --workspace apps/web
      - name: Start throwaway server with dummy creds
        run: |
          STORAGE_DIR=/tmp/wl-scenes \
          AUTH_SECRET=dummy-secret-for-ci-only \
          GOOGLE_CLIENT_ID=dummy-ci-id \
          GOOGLE_CLIENT_SECRET=dummy-ci-secret \
          AUTH_URL=http://localhost:3000 \
          nohup npx next start --port 3000 > /tmp/pixa-ci2.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/me > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:3000/api/me
        working-directory: apps/web
      - name: Run scenes lifecycle tests
        env:
          AUTH_SECRET: dummy-secret-for-ci-only
          AUTH_URL: http://localhost:3000
        run: STORE=/tmp/wl-scenes BASE=http://localhost:3000 bash scripts/test-scenes.sh

  longvideo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci
      - run: npm run build --workspace apps/web
      - name: Start throwaway server with dummy creds
        run: |
          STORAGE_DIR=/tmp/wl-longvideo \
          AUTH_SECRET=dummy-secret-for-ci-only \
          GOOGLE_CLIENT_ID=dummy-ci-id \
          GOOGLE_CLIENT_SECRET=dummy-ci-secret \
          AUTH_URL=http://localhost:3000 \
          nohup npx next start --port 3000 > /tmp/pixa-ci3.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/me > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:3000/api/me
        working-directory: apps/web
      - name: Run long-video suite
        env:
          AUTH_SECRET: dummy-secret-for-ci-only
          AUTH_URL: http://localhost:3000
          DSTORE: /tmp/wl-longvideo
        run: BASE=http://localhost:3000 bash scripts/test-longvideo.sh

  # Edge deploy: pushes workers/pixa-proxy to pixa.<account>.workers.dev
  # on every push to main. Requires repo secrets (Settings → Secrets →
  # Actions → New repository secret):
  #   CLOUDFLARE_API_TOKEN  (Edit Cloudflare Workers template token)
  #   CLOUDFLARE_ACCOUNT_ID (dash → Workers → Overview → Account ID)
  # NOTE: this redeploys the EDGE PROXY only. The Mac app + tunnel are not
  # touched — pull + rebuild locally to update the running server. ORIGIN in
  # workers/pixa-proxy/wrangler.toml must be the stable named-tunnel URL;
  # quick-tunnel URLs rotate and will 502 the site after a restart.
  deploy-edge:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    needs: [typecheck, worker-smoke, notify-unit, worker-perf, notifications, auth, scenes, longvideo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g wrangler
      - name: Deploy edge worker
        run: wrangler deploy --cwd workers/pixa-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
